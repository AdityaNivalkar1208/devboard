# Goal - To run end to end DevSecOps CI Pipelines

name: DevSecOps

on:
    push:
        branches: [main]

jobs:
    code-quality:
        uses: ./.github/workflows/code-quality.yml
    
    scan-secrets:
        uses: ./.github/workflows/secret-scanning.yml
    
    dependency-checks:
        uses: ./.github/workflows/dependency-scan.yml

    docker-checks:
        uses: ./.github/workflows/docker-scans.yml
        secrets: inherit

    sonar-qube:
        uses: ./.github/workflows/sonar-scan.yml
        secrets: inherit
    
    code-tests:
        uses: ./.github/workflows/code-tests.yml

    docker-push:
        uses: ./.github/workflows/docker-push.yml
        needs: [code-quality, code-tests, scan-secrets, dependency-checks, docker-checks, sonar-qube]
        secrets: inherit
    
    deploy:
        needs: [docker-push]
        uses: ./.github/workflows/cd.yml
        secrets: inherit