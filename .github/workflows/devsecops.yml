# Goal - To run end to end DevSecOps CI Pipelines

name: DevSecOps

on:
    push:
        branches: [main]

jobs:
    code-quality:
        uses: ./.github/workflows/code-quality.yml
    
    scan-secrets:
        uses: ./.github/workflows/secret-scanning.yml
    
    dependency-checks:
        uses: ./.github/workflows/dependency-scan.yml
